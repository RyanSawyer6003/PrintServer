# Builds and publishes the images to GitHub Container Registry:
#   ghcr.io/<owner>/printserver-cups and ghcr.io/<owner>/printserver-usage
#
# - When a release is published: that release, plus the current prod and dev
#   releases. Channel tags follow the tag names (scripts/ci/release-plan.sh):
#   prod is the newest vX.Y.Z, dev the newest of all including vX.Y.Z-<suffix>.
# - Monthly: the current prod and dev releases again, on a fresh Debian base
#   with current packages. This is the security rebuild servers pick up.
# - By hand (Actions → Publish images → Run workflow): the same as monthly.
#
# Every image is built from scratch, smoke-tested, and only then pushed, so a
# Debian update that breaks the image never reaches a channel tag.
name: Publish images

on:
  release:
    types: [published]
  schedule:
    - cron: "23 6 1 * *"     # 06:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Choose releases and tags
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          matrix=$(IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}" scripts/ci/release-plan.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Images to publish"
            if [ "$matrix" = "[]" ]; then
              echo "None: there is no vX.Y.Z or vX.Y.Z-<suffix> release yet."
            else
              jq -r '.[] | "**\(.version)**\n```\n\(.cups_tags)\n\(.usage_tags)\n```"' <<<"$matrix"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the CI scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: ci
          persist-credentials: false

      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false

      # Both images are built and tested before either is pushed.
      - name: Build both images from scratch
        env:
          VERSION: ${{ matrix.version }}
        run: |
          for img in cups usage; do
            ctx=src; [ "$img" = usage ] && ctx=src/usage
            docker build --pull --no-cache \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=$(git -C src rev-parse HEAD)" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label "org.opencontainers.image.description=PrintServer ${img} image" \
              -t "printserver-${img}:test" "$ctx"
          done

      - name: Smoke test (cups)
        env:
          SMOKE_SRC: ${{ github.workspace }}/src
        run: ci/scripts/ci/smoke-test.sh cups printserver-cups:test

      - name: Smoke test (usage)
        env:
          SMOKE_SRC: ${{ github.workspace }}/src
        run: ci/scripts/ci/smoke-test.sh usage printserver-usage:test

      - name: Push the tested images
        env:
          CUPS_TAGS: ${{ matrix.cups_tags }}
          USAGE_TAGS: ${{ matrix.usage_tags }}
          VERSION: ${{ matrix.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          push() {    # push <local image> <tags>
            while read -r tag; do
              [ -n "$tag" ] || continue
              docker tag "$1" "$tag"
              docker push --quiet "$tag"
            done <<<"$2"
          }
          push printserver-cups:test "$CUPS_TAGS"
          push printserver-usage:test "$USAGE_TAGS"
          docker logout ghcr.io
          {
            echo "### $VERSION"
            echo '```'
            echo "$CUPS_TAGS"
            echo "$USAGE_TAGS"
            for img in cups usage; do
              docker inspect -f '{{index .RepoDigests 0}}' "printserver-${img}:test"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
