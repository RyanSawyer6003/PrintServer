# Builds and publishes the images to GitHub Container Registry:
#   ghcr.io/<owner>/printserver-cups and ghcr.io/<owner>/printserver-usage
#
# - When a release is published: that release. Channel tags follow the tag
#   names (scripts/ci/release-plan.sh): prod is the newest vX.Y.Z, dev the
#   newest of all including vX.Y.Z-<suffix>. A vX.Y.Z release must be on main.
# - Called by dev-release.yml with the weekly dev build's tag: the same as a
#   release. (A release that a workflow creates doesn't trigger other
#   workflows, so dev-release.yml calls this one directly.)
# - Nightly: the current dev release again, on a fresh Debian base with
#   current packages. Weekly: the same for the current prod release. Each is
#   pushed only if it differs from the published image (scripts/ci/image-changed.sh),
#   so a server updates when Debian ships a fix, not every night.
# - By hand (Actions → Publish images → Run workflow): a rebuild of the
#   channels chosen, with or without the check for changes.
#
# Every image is built from scratch and smoke-tested with its own release's
# test before it is pushed, so a Debian update that breaks the image never
# reaches a channel tag.
name: Publish images

on:
  release:
    types: [published]
  schedule:
    - cron: "23 6 * * *"     # nightly 06:23 UTC: the dev channel
    - cron: "43 7 * * 0"     # Sundays 07:43 UTC: the prod channel
  workflow_dispatch:
    inputs:
      channels:
        description: Channels to rebuild
        type: choice
        options: ["dev prod", dev, prod]
        default: "dev prod"
      only_if_changed:
        description: Push only if the image differs from the published one
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        description: Tag of a release to build, as if it had just been published
        type: string
        required: true
      prerelease:
        description: Whether that release is a pre-release
        type: boolean
        required: true

permissions:
  contents: read

env:
  PROD_BRANCH: main           # stable: prod releases are tagged here
  WEEKLY_CRON: "43 7 * * 0"   # must match the prod schedule above

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Choose releases and tags
        env:
          EVENT: ${{ inputs.release_tag && 'release' || github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          PRERELEASE: ${{ inputs.release_tag && inputs.prerelease || github.event.release.prerelease }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_CHANNELS: ${{ github.event.inputs.channels }}
          DISPATCH_ONLY_IF_CHANGED: ${{ github.event.inputs.only_if_changed }}
        run: |
          case $EVENT in
            schedule)
              if [ "$SCHEDULE" = "$WEEKLY_CRON" ]; then CHANNELS=prod; else CHANNELS=dev; fi
              ONLY_IF_CHANGED=true ;;
            workflow_dispatch)
              CHANNELS=${DISPATCH_CHANNELS:-dev prod}
              ONLY_IF_CHANGED=${DISPATCH_ONLY_IF_CHANGED:-true} ;;
          esac
          export CHANNELS ONLY_IF_CHANGED
          matrix=$(IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}" scripts/ci/release-plan.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Images to publish"
            if [ "$matrix" = "[]" ]; then
              echo "None: there is no vX.Y.Z or vX.Y.Z-<suffix> release yet."
            else
              jq -r '.[] | "**\(.version)**\(if .only_if_changed then " (only if changed from `\(.compare_tag)`)" else "" end)\n```\n\(.cups_tags)\n\(.usage_tags)\n```"' <<<"$matrix"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the CI scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          path: ci
          persist-credentials: false

      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false

      # Both images are built and tested before either is pushed.
      - name: Build both images from scratch
        env:
          VERSION: ${{ matrix.version }}
        run: |
          for img in cups usage; do
            ctx=src; [ "$img" = usage ] && ctx=src/usage
            docker build --pull --no-cache \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=$(git -C src rev-parse HEAD)" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label "org.opencontainers.image.description=PrintServer ${img} image" \
              -t "printserver-${img}:test" "$ctx"
          done

      # Scheduled rebuilds: push only if the new pair differs from what the
      # channel serves now. Either image differing publishes both.
      - id: changed
        name: Compare with the published images
        env:
          ONLY_IF_CHANGED: ${{ matrix.only_if_changed }}
          BASE: ghcr.io/${{ github.repository }}
          COMPARE: ${{ matrix.compare_tag }}
          VERSION: ${{ matrix.version }}
        run: |
          if [ "$ONLY_IF_CHANGED" != true ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=${BASE,,}
          publish=false
          {
            echo "### $VERSION: compared with \`$COMPARE\`"
            for img in cups usage; do
              set +e
              out=$(ci/scripts/ci/image-changed.sh "printserver-${img}:test" "$base-${img}:$COMPARE")
              rc=$?
              set -e
              [ "$rc" -le 1 ] || { echo "::error::comparing the $img image failed"; exit 1; }
              [ "$rc" -eq 0 ] && publish=true
              echo "**$img:**"
              echo '```'
              echo "$out"
              echo '```'
            done
            [ "$publish" = true ] && echo "Publishing." || echo "Nothing changed: not published."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # Each release is tested with its own test, so an older release isn't
      # held to checks for features it doesn't have. The script from the
      # default branch is the fallback for a release that predates it.
      - name: Smoke test (cups)
        if: steps.changed.outputs.publish == 'true'
        env:
          SMOKE_SRC: ${{ github.workspace }}/src
        run: |
          t=src/scripts/ci/smoke-test.sh; [ -x "$t" ] || t=ci/scripts/ci/smoke-test.sh
          "$t" cups printserver-cups:test

      - name: Smoke test (usage)
        if: steps.changed.outputs.publish == 'true'
        env:
          SMOKE_SRC: ${{ github.workspace }}/src
        run: |
          t=src/scripts/ci/smoke-test.sh; [ -x "$t" ] || t=ci/scripts/ci/smoke-test.sh
          "$t" usage printserver-usage:test

      - name: Push the tested images
        if: steps.changed.outputs.publish == 'true'
        env:
          CUPS_TAGS: ${{ matrix.cups_tags }}
          USAGE_TAGS: ${{ matrix.usage_tags }}
          VERSION: ${{ matrix.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          push() {    # push <local image> <tags>
            while read -r tag; do
              [ -n "$tag" ] || continue
              docker tag "$1" "$tag"
              docker push --quiet "$tag"
            done <<<"$2"
          }
          push printserver-cups:test "$CUPS_TAGS"
          push printserver-usage:test "$USAGE_TAGS"
          docker logout ghcr.io
          {
            echo "### $VERSION"
            echo '```'
            echo "$CUPS_TAGS"
            echo "$USAGE_TAGS"
            for img in cups usage; do
              docker inspect -f '{{index .RepoDigests 0}}' "printserver-${img}:test"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
