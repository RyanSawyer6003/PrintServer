services:
  cups:
    build: .
    container_name: ${CUPS_CONTAINER_NAME:-cups}
    hostname: ${CUPS_HOSTNAME:?set CUPS_HOSTNAME in .env}
    env_file:
      - .env
    networks:
      services_vlan:
        ipv4_address: ${SERVICES_IP:?set SERVICES_IP in .env}
        # The container's default route must use this network. Without a
        # priority, Docker picks the network whose name sorts first, which
        # is the printer network. Needs Docker Engine 28+ / Compose 2.33.1+.
        gw_priority: 1
      printer_vlan:
        ipv4_address: ${PRINTER_IP:?set PRINTER_IP in .env}
    volumes:
      - cups_config:/etc/cups
      - cups_spool:/var/spool/cups
      - cups_logs:/var/log/cups
      # Usage reports, written by the usage service and served by CUPS at /usage/.
      - usage_reports:${CUPS_DOCROOT:-/usr/share/cups/doc-root}/usage:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r | grep -qx 'scheduler is running'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reads the CUPS page log and writes the usage reports. Report only: it has
  # no network access and cannot see or change print jobs.
  usage:
    build: ./usage
    container_name: ${USAGE_CONTAINER_NAME:-cups-usage}
    environment:
      USAGE_MONTHLY_PAGES: ${USAGE_MONTHLY_PAGES:-0}
      TZ: ${USAGE_TIMEZONE:-UTC}
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - cups_logs:/var/log/cups:ro
      - usage_data:/data
      - usage_reports:/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /data/heartbeat) )) -lt 300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  services_vlan:
    driver: macvlan
    driver_opts:
      parent: ${SERVICES_PARENT_IF:?set SERVICES_PARENT_IF in .env}
    ipam:
      config:
        - subnet: ${SERVICES_SUBNET:?set SERVICES_SUBNET in .env}
          gateway: ${SERVICES_GATEWAY:?set SERVICES_GATEWAY in .env}
  printer_vlan:
    driver: macvlan
    driver_opts:
      parent: ${PRINTER_PARENT_IF:?set PRINTER_PARENT_IF in .env}
    ipam:
      config:
        - subnet: ${PRINTER_SUBNET:?set PRINTER_SUBNET in .env}
          gateway: ${PRINTER_GATEWAY:?set PRINTER_GATEWAY in .env}

volumes:
  cups_config:
  cups_spool:
  cups_logs:
  usage_data:
  usage_reports:
